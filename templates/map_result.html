<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ forest_name }} — Elfak GIS Pro Studio</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon" />
<style>
  :root { --bg:#f5f5f7; --txt:#1d1d1f; --accent:#059669; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--txt); }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px;
           background:#fff; border-bottom:1px solid rgba(0,0,0,.09); }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  header .sub { color:#86868b; font-size:13px; }
  header .sp { flex:1; }
  .btn { display:inline-block; padding:8px 16px; border-radius:999px;
         background:var(--accent); color:#fff; text-decoration:none;
         font-size:14px; font-weight:600; }
  .btn.ghost { background:rgba(0,0,0,.06); color:var(--txt); }
  main { max-width:1000px; margin:22px auto; padding:0 16px 40px; }
  figure { margin:0; background:#fff; border-radius:18px; overflow:hidden;
           box-shadow:0 12px 40px rgba(0,0,0,.14); }
  img { display:block; width:100%; height:auto; }
  figcaption { padding:12px 18px; font-size:13px; color:#515154; }
</style>
</head>
<body>
<header>
  <span style="font-size:22px">🌲</span>
  <div>
    <h1>{{ forest_name }}</h1>
    <div class="sub">Run {{ run_id }}{% if area_ha %} · Area: {{ area_ha }} ha{% endif %}</div>
  </div>
  <span class="sp"></span>
  <a class="btn ghost" href="/">← Studio</a>
  <a class="btn" href="{{ map_url }}" download>⬇ PNG</a>
  <a class="btn" href="/download/{{ run_id }}">📦 ZIP</a>
</header>
<main>
  <figure>
    <img src="{{ map_url }}" alt="Map of {{ forest_name }}" />
    <figcaption>{{ forest_name }} — A4 survey map (300 DPI). Use the ZIP download for shapefiles + KMZ.</figcaption>
  </figure>
</main>
</body>
</html>
