<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.5,user-scalable=yes" />
    <title>Sign in · Elfak GIS Studio</title>
    <meta name="description" content="Sign in to Elfak GIS Studio — the same username and password you use on Forestry PSC Preparation." />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://elfakgisstudio.onrender.com/login" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />

    <!-- Same fonts and stylesheets as the studio, so the sign-in page and
         the app read as one product. Inter is self-hosted: the CSP does not
         allow fonts.googleapis.com, so the old remote request was blocked and
         the page fell back to a system font. -->
    <link rel="preload" as="font" type="font/woff2" href="/static/fonts/inter-latin.woff2" crossorigin />
    <link rel="stylesheet" href="/static/css/fonts.css?v=20260930-1" />
    <link rel="stylesheet" href="/static/css/app.css?v=20260930-1" />
    <link rel="stylesheet" href="/static/css/forestry.css?v=20260929-9" />
    <link rel="stylesheet" href="/static/css/motion.css?v=20260929-2" />

    <!-- The studio shell is fetched while the visitor types, so signing in
         lands on a studio that has already painted. These are "prefetch"
         rather than "preload": the studio files are not needed to render
         this page, and prefetch marks them low-priority so they never
         compete with the sign-in form or prefetch.js itself. -->
    <link rel="preload" as="style" href="/static/css/forestry.css?v=20260929-9" />
    <link rel="preload" as="script" href="/static/js/prefetch.js?v=20260929-2" />
    <link rel="prefetch" as="style" href="/static/css/app.css?v=20260930-1" />
    <link rel="prefetch" as="script" href="/static/js/app.js?v=20260929-8" />
    <link rel="prefetch" as="script" href="/static/js/dock.js?v=20260930-1" />
    <link rel="prefetch" as="script" href="/static/js/dock-resize.js?v=20260930-1" />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
</head>
<body class="login-page">
    <div id="theme-flash"></div>

    <main class="login-stage">
        <div class="login-card">
            <div class="login-head">
                <span class="login-mark" aria-hidden="true">
                    <img src="/static/elfak-logo-64.png" width="44" height="44"
                         alt="Elfak GIS Studio" decoding="async">
                </span>
                <span class="login-title">Elfak GIS Studio</span>
            </div>
            <p class="login-sub">Forestry PSC Preparation · one shared account</p>

            <form id="login-form" autocomplete="on" onsubmit="doLogin();return false;">
                <div class="login-field">
                    <label class="login-label" for="login-inp">Username</label>
                    <input type="text" id="login-inp" class="input" name="username" placeholder="e.g. student123" maxlength="40"
                           autocomplete="username" autocapitalize="none" autocorrect="off"
                           spellcheck="false" enterkeyhint="next"
                           aria-describedby="login-hint" autofocus
                           oninput="_checkUsernameHint(this.value)">
                    <p id="login-hint" role="status" aria-live="polite"></p>
                </div>

                <div class="login-field">
                    <label class="login-label" for="login-pw">Password</label>
                    <div class="pw-wrap">
                        <input type="password" id="login-pw" class="input" name="password" placeholder="Your password" maxlength="128"
                               autocomplete="current-password" autocapitalize="none" autocorrect="off"
                               spellcheck="false" enterkeyhint="go"
                               aria-label="Password">
                        <button type="button" class="pw-toggle" id="pw-toggle" onclick="togglePw()"
                                aria-label="Show password" aria-pressed="false">
                            <svg id="pw-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <p class="login-err" id="lerr" role="alert"></p>
                <p id="sugg">Similar names: <span></span> <span></span> <span></span></p>

                <button type="submit" id="login-go" class="btn btn-primary">Sign in</button>
            </form>

            <p class="login-note">
                Same account as <a href="https://forestry-pscpreparation.onrender.com/" target="_blank" rel="noopener noreferrer">Forestry PSC Preparation</a> — new here? Your account is created instantly.
            </p>
        </div>

        <div class="appearance">
            <div>
                <div class="appearance-label">Appearance</div>
                <div class="seg" role="group" aria-label="Appearance">
                    <button type="button" class="seg-btn" data-mode="light" aria-pressed="false">Light</button>
                    <button type="button" class="seg-btn" data-mode="dark" aria-pressed="false">Dark</button>
                    <button type="button" class="seg-btn" data-mode="system" aria-pressed="false">System</button>
                </div>
            </div>
        </div>

        <p class="login-foot">
            Just signed in there?
            <a href="https://forestry-pscpreparation.onrender.com/" target="_blank" rel="noopener noreferrer">Open Forestry PSC &#8599;</a>
        </p>

        <p class="login-prep" id="prep" role="status" aria-live="polite" hidden></p>
    </main>

    <script defer src="/static/js/theme.js?v=20260929-3"></script>
    <script defer src="/static/js/prefetch.js?v=20260929-2"></script>
    <script defer src="/static/js/login.js?v=20260929-3"></script>
</body>
</html>
